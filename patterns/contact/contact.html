<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聯絡 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<header class="ww-opener">
  <p class="ww-kicker"><span class="ww-kicker__no">No. 06</span>聯絡</p>
  <h2>告訴我們您想解決的問題</h2>
  <hr class="ww-rule">
</header>
<div class="ww-split ww-split--start">
  <form class="ww-form" action="#">
    <div class="ww-field"><label class="ww-field__label" for="c-name-zh">您的名字</label><input class="ww-input" id="c-name-zh" name="name" autocomplete="name"></div>
    <div class="ww-field"><label class="ww-field__label" for="c-mail-zh">電子郵件</label><input class="ww-input" id="c-mail-zh" name="email" type="email" autocomplete="email"></div>
    <div class="ww-field"><label class="ww-field__label" for="c-msg-zh">想解決的問題</label><textarea class="ww-textarea" id="c-msg-zh" name="message"></textarea></div>
    <div class="ww-cluster"><button class="ww-btn ww-btn--primary" type="submit">送出</button></div>
  </form>
  <dl class="ww-contact__details">
    <dt>公司</dt><dd>走路鯨魚數位體驗有限公司</dd>
    <dt>地點</dt><dd>台北</dd>
    <dt>語言</dt><dd>中文、English</dd>
  </dl>
</div>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<header class="ww-opener">
  <p class="ww-kicker"><span class="ww-kicker__no">No. 06</span>Contact</p>
  <h2>Tell us the problem you want to solve</h2>
  <hr class="ww-rule">
</header>
<div class="ww-split ww-split--start">
  <form class="ww-form" action="#">
    <div class="ww-field"><label class="ww-field__label" for="c-name-en">Your name</label><input class="ww-input" id="c-name-en" name="name" autocomplete="name"></div>
    <div class="ww-field"><label class="ww-field__label" for="c-mail-en">Email</label><input class="ww-input" id="c-mail-en" name="email" type="email" autocomplete="email"></div>
    <div class="ww-field"><label class="ww-field__label" for="c-msg-en">The problem to solve</label><textarea class="ww-textarea" id="c-msg-en" name="message"></textarea></div>
    <div class="ww-cluster"><button class="ww-btn ww-btn--primary" type="submit">Send</button></div>
  </form>
  <dl class="ww-contact__details">
    <dt>Company</dt><dd>Walking Whale Co., Ltd.</dd>
    <dt>Location</dt><dd>Taipei</dd>
    <dt>Languages</dt><dd>English, Mandarin</dd>
  </dl>
</div>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
