<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行動呼籲 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<section class="ww-section ww-on-dark">
  <div class="ww-container ww-cta">
    <div class="ww-cta__text">
      <p class="ww-kicker"><span class="ww-kicker__no">No. 05</span>下一步</p>
      <h2>先聊聊，再決定要不要一起做</h2>
      <p class="ww-lede">每一次合作都從一次對話開始。</p>
    </div>
    <div class="ww-cta__actions"><a class="ww-btn ww-btn--primary ww-btn--lg" href="#">開始對話<svg class="ww-icon ww-icon--arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a><a class="ww-btn ww-btn--secondary ww-btn--lg" href="#">先看作品</a></div>
  </div>
</section>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<section class="ww-section ww-on-dark">
  <div class="ww-container ww-cta">
    <div class="ww-cta__text">
      <p class="ww-kicker"><span class="ww-kicker__no">No. 05</span>Next step</p>
      <h2>Talk first, then decide whether to work together</h2>
      <p class="ww-lede">Every engagement starts with a conversation.</p>
    </div>
    <div class="ww-cta__actions"><a class="ww-btn ww-btn--primary ww-btn--lg" href="#">Start a conversation<svg class="ww-icon ww-icon--arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a><a class="ww-btn ww-btn--secondary ww-btn--lg" href="#">See our work first</a></div>
  </div>
</section>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
