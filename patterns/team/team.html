<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>團隊 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<header class="ww-opener">
  <p class="ww-kicker"><span class="ww-kicker__no">No. 04</span>我們的人</p>
  <h2>小團隊，深功夫</h2>
  <hr class="ww-rule">
</header>
<div class="ww-team"><figure class="ww-person"><div class="ww-person__portrait" aria-hidden="true">C</div><figcaption class="ww-stack ww-stack--xs"><h3 class="ww-person__name">Czesio</h3><p class="ww-person__role">創辦人</p><p class="ww-person__bio">負責系統架構與搜尋、推薦等機器學習的判斷。</p></figcaption></figure><figure class="ww-person"><div class="ww-person__portrait" aria-hidden="true">J</div><figcaption class="ww-stack ww-stack--xs"><h3 class="ww-person__name">Jeff</h3><p class="ww-person__role">客戶成功</p><p class="ww-person__bio">從第一次見面到上線之後，確保合作一直走在對的方向。</p></figcaption></figure><figure class="ww-person"><div class="ww-person__portrait" aria-hidden="true">C</div><figcaption class="ww-stack ww-stack--xs"><h3 class="ww-person__name">Charlene</h3><p class="ww-person__role">設計與品牌</p><p class="ww-person__bio">把產品的價值轉成人真正有感的介面與品牌。</p></figcaption></figure><figure class="ww-person"><div class="ww-person__portrait" aria-hidden="true">E</div><figcaption class="ww-stack ww-stack--xs"><h3 class="ww-person__name">Evan</h3><p class="ww-person__role">全端與互動</p><p class="ww-person__bio">前後端與互動細節，效能和手感一起顧。</p></figcaption></figure><figure class="ww-person"><div class="ww-person__portrait" aria-hidden="true">L</div><figcaption class="ww-stack ww-stack--xs"><h3 class="ww-person__name">Leo</h3><p class="ww-person__role">研究</p><p class="ww-person__bio">因果推論、模型穩健性與資料品質，讓我們對模型保持誠實。</p></figcaption></figure></div>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<header class="ww-opener">
  <p class="ww-kicker"><span class="ww-kicker__no">No. 04</span>Our people</p>
  <h2>A small team that goes deep</h2>
  <hr class="ww-rule">
</header>
<div class="ww-team"><figure class="ww-person"><div class="ww-person__portrait" aria-hidden="true">C</div><figcaption class="ww-stack ww-stack--xs"><h3 class="ww-person__name">Czesio</h3><p class="ww-person__role">Founder</p><p class="ww-person__bio">Owns system architecture and machine learning calls such as search and recommendation.</p></figcaption></figure><figure class="ww-person"><div class="ww-person__portrait" aria-hidden="true">J</div><figcaption class="ww-stack ww-stack--xs"><h3 class="ww-person__name">Jeff</h3><p class="ww-person__role">Customer success</p><p class="ww-person__bio">Keeps every engagement on course, from the first meeting to well after launch.</p></figcaption></figure><figure class="ww-person"><div class="ww-person__portrait" aria-hidden="true">C</div><figcaption class="ww-stack ww-stack--xs"><h3 class="ww-person__name">Charlene</h3><p class="ww-person__role">Design and brand</p><p class="ww-person__bio">Turns what a product does into interfaces and brands people actually feel.</p></figcaption></figure><figure class="ww-person"><div class="ww-person__portrait" aria-hidden="true">E</div><figcaption class="ww-stack ww-stack--xs"><h3 class="ww-person__name">Evan</h3><p class="ww-person__role">Full stack and interaction</p><p class="ww-person__bio">Front end, back end and interaction detail, with performance and feel treated as one.</p></figcaption></figure><figure class="ww-person"><div class="ww-person__portrait" aria-hidden="true">L</div><figcaption class="ww-stack ww-stack--xs"><h3 class="ww-person__name">Leo</h3><p class="ww-person__role">Research</p><p class="ww-person__bio">Causal inference, robustness and data quality, so we stay honest about our models.</p></figcaption></figure></div>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
