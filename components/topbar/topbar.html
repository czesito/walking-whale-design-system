<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>頂部導覽 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<header class="ww-topbar">
  <div class="ww-container ww-topbar__inner">
    <a class="ww-topbar__brand" href="#"><img class="ww-logo ww-logo--sm" src="../../assets/wordmark/walking-whale-wordmark-horizontal-zh-abyss.svg" alt="走路鯨魚"></a>
    <nav class="ww-topbar__nav" aria-label="主要導覽"><a class="ww-topbar__link" href="#" aria-current="page">作品</a><a class="ww-topbar__link" href="#">團隊</a><a class="ww-topbar__link" href="#">文章</a></nav>
    <div class="ww-topbar__actions">
      <div class="ww-lang"><a href="#" aria-current="true" lang="zh-Hant" aria-label="中文">中</a><a href="#" aria-current="false" lang="en" aria-label="English">EN</a></div>
      <a class="ww-btn ww-btn--secondary ww-btn--sm ww-topbar__cta" href="#">聯絡我們</a>
      <button class="ww-btn ww-btn--ghost ww-btn--icon ww-topbar__menu" type="button" data-ww-open="topbar-drawer-zh" aria-expanded="false" aria-label="開啟選單"><svg class="ww-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>
    </div>
  </div>
</header>
<dialog class="ww-drawer" id="topbar-drawer-zh" aria-label="選單">
  <div class="ww-drawer__head"><img class="ww-logo ww-logo--sm" src="../../assets/wordmark/walking-whale-wordmark-horizontal-zh-abyss.svg" alt="走路鯨魚"><button class="ww-btn ww-btn--ghost ww-btn--icon" type="button" data-ww-close aria-label="關閉選單"><svg class="ww-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  <nav class="ww-drawer__nav" aria-label="主要導覽"><a href="#" aria-current="page">作品</a><a href="#">團隊</a><a href="#">文章</a></nav>
  <div class="ww-drawer__foot"><a class="ww-btn ww-btn--primary ww-btn--block" href="#">聯絡我們</a><div class="ww-lang"><a href="#" aria-current="true" lang="zh-Hant">中</a><a href="#" aria-current="false" lang="en">EN</a></div></div>
</dialog>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<header class="ww-topbar">
  <div class="ww-container ww-topbar__inner">
    <a class="ww-topbar__brand" href="#"><img class="ww-logo ww-logo--sm" src="../../assets/wordmark/walking-whale-wordmark-horizontal-en-abyss.svg" alt="Walking Whale"></a>
    <nav class="ww-topbar__nav" aria-label="Main"><a class="ww-topbar__link" href="#" aria-current="page">Work</a><a class="ww-topbar__link" href="#">Team</a><a class="ww-topbar__link" href="#">Articles</a></nav>
    <div class="ww-topbar__actions">
      <div class="ww-lang"><a href="#" aria-current="false" lang="zh-Hant" aria-label="中文">中</a><a href="#" aria-current="true" lang="en" aria-label="English">EN</a></div>
      <a class="ww-btn ww-btn--secondary ww-btn--sm ww-topbar__cta" href="#">Contact us</a>
      <button class="ww-btn ww-btn--ghost ww-btn--icon ww-topbar__menu" type="button" data-ww-open="topbar-drawer-en" aria-expanded="false" aria-label="Open menu"><svg class="ww-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>
    </div>
  </div>
</header>
<dialog class="ww-drawer" id="topbar-drawer-en" aria-label="Menu">
  <div class="ww-drawer__head"><img class="ww-logo ww-logo--sm" src="../../assets/wordmark/walking-whale-wordmark-horizontal-en-abyss.svg" alt="Walking Whale"><button class="ww-btn ww-btn--ghost ww-btn--icon" type="button" data-ww-close aria-label="Close menu"><svg class="ww-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
  <nav class="ww-drawer__nav" aria-label="Main"><a href="#" aria-current="page">Work</a><a href="#">Team</a><a href="#">Articles</a></nav>
  <div class="ww-drawer__foot"><a class="ww-btn ww-btn--primary ww-btn--block" href="#">Contact us</a><div class="ww-lang"><a href="#" aria-current="false" lang="zh-Hant">中</a><a href="#" aria-current="true" lang="en">EN</a></div></div>
</dialog>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
