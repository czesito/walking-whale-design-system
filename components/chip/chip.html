<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>標籤 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<div class="ww-cluster ww-cluster--sm">
  <span class="ww-chip">運動</span><span class="ww-chip">餐飲</span><span class="ww-chip">文化資產</span>
</div>
<div class="ww-cluster ww-cluster--sm" data-ww-single>
  <button class="ww-chip" type="button" aria-pressed="true" data-ww-toggle>全部<span class="ww-chip__count">12</span></button>
  <button class="ww-chip" type="button" aria-pressed="false" data-ww-toggle>工程<span class="ww-chip__count">5</span></button>
  <button class="ww-chip" type="button" aria-pressed="false" data-ww-toggle>案例<span class="ww-chip__count">4</span></button>
</div>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<div class="ww-cluster ww-cluster--sm">
  <span class="ww-chip">Sports</span><span class="ww-chip">Food and beverage</span><span class="ww-chip">Heritage</span>
</div>
<div class="ww-cluster ww-cluster--sm" data-ww-single>
  <button class="ww-chip" type="button" aria-pressed="true" data-ww-toggle>All<span class="ww-chip__count">12</span></button>
  <button class="ww-chip" type="button" aria-pressed="false" data-ww-toggle>Engineering<span class="ww-chip__count">5</span></button>
  <button class="ww-chip" type="button" aria-pressed="false" data-ww-toggle>Cases<span class="ww-chip__count">4</span></button>
</div>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
