<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>按鈕與連結 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<div class="ww-cluster">
  <a class="ww-btn ww-btn--primary" href="#">開始對話<svg class="ww-icon ww-icon--arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
  <a class="ww-btn ww-btn--secondary" href="#">查看作品</a>
  <button class="ww-btn ww-btn--ghost" type="button">稍後再說</button>
  <a class="ww-btn ww-btn--signal" href="#">預約時間</a>
</div>
<div class="ww-cluster">
  <button class="ww-btn ww-btn--secondary ww-btn--sm" type="button">小按鈕</button>
  <button class="ww-btn ww-btn--secondary ww-btn--lg" type="button">大按鈕</button>
  <button class="ww-btn ww-btn--secondary" type="button" disabled>無法使用</button>
  <button class="ww-btn ww-btn--ghost ww-btn--icon" type="button" aria-label="開啟選單"><svg class="ww-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>
</div>
<p class="ww-body">內文中的<a class="ww-link" href="#">文字連結</a>使用 accent 色並加底線。</p>
<a class="ww-link--arrow" href="#">閱讀完整案例<svg class="ww-icon ww-icon--arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
<div class="ww-on-dark ww-section"><div class="ww-container ww-cluster">
  <a class="ww-btn ww-btn--primary" href="#">開始對話<svg class="ww-icon ww-icon--arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
  <a class="ww-btn ww-btn--secondary" href="#">查看作品</a>
  <a class="ww-btn ww-btn--signal" href="#">預約時間</a>
</div></div>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<div class="ww-cluster">
  <a class="ww-btn ww-btn--primary" href="#">Start a conversation<svg class="ww-icon ww-icon--arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
  <a class="ww-btn ww-btn--secondary" href="#">See our work</a>
  <button class="ww-btn ww-btn--ghost" type="button">Not now</button>
  <a class="ww-btn ww-btn--signal" href="#">Book a time</a>
</div>
<div class="ww-cluster">
  <button class="ww-btn ww-btn--secondary ww-btn--sm" type="button">Small</button>
  <button class="ww-btn ww-btn--secondary ww-btn--lg" type="button">Large</button>
  <button class="ww-btn ww-btn--secondary" type="button" disabled>Unavailable</button>
  <button class="ww-btn ww-btn--ghost ww-btn--icon" type="button" aria-label="Open menu"><svg class="ww-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>
</div>
<p class="ww-body">A <a class="ww-link" href="#">text link</a> in running text uses the accent color and an underline.</p>
<a class="ww-link--arrow" href="#">Read the full case<svg class="ww-icon ww-icon--arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
