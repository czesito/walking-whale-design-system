<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表格 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<div class="ww-table-wrap">
  <table class="ww-table">
    <caption>表 1　合作階段與產出</caption>
    <thead><tr><th scope="col">階段</th><th scope="col">產出</th><th scope="col" class="ww-num">週數</th></tr></thead>
    <tbody>
      <tr><th scope="row">相識</th><td>需求問卷、訪談紀錄</td><td class="ww-num">1</td></tr>
      <tr><th scope="row">理解</th><td>流程圖、規格書、決策紀錄</td><td class="ww-num">2</td></tr>
      <tr><th scope="row">成形</th><td>第一個可用版本</td><td class="ww-num">4</td></tr>
    </tbody>
    <tfoot><tr><td colspan="2">合計</td><td class="ww-num">7</td></tr></tfoot>
  </table>
</div>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<div class="ww-table-wrap">
  <table class="ww-table">
    <caption>Table 1　Stages and deliverables</caption>
    <thead><tr><th scope="col">Stage</th><th scope="col">Deliverables</th><th scope="col" class="ww-num">Weeks</th></tr></thead>
    <tbody>
      <tr><th scope="row">Meet</th><td>Questionnaire, interview notes</td><td class="ww-num">1</td></tr>
      <tr><th scope="row">Understand</th><td>Process map, spec, decision records</td><td class="ww-num">2</td></tr>
      <tr><th scope="row">Shape</th><td>First usable release</td><td class="ww-num">4</td></tr>
    </tbody>
    <tfoot><tr><td colspan="2">Total</td><td class="ww-num">7</td></tr></tfoot>
  </table>
</div>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
