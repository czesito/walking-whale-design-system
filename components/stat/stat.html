<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數據 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<div class="ww-grid ww-grid--3">
  <div class="ww-stat"><p class="ww-stat__value">38<span class="ww-stat__unit">小時</span></p><p class="ww-stat__label">每月省下的對帳時間</p><p class="ww-stat__note">範例數據</p></div>
  <div class="ww-stat"><p class="ww-stat__value">4<span class="ww-stat__unit">週</span></p><p class="ww-stat__label">第一個可用版本上線</p><p class="ww-stat__note">範例數據</p></div>
  <div class="ww-stat"><p class="ww-stat__value">0</p><p class="ww-stat__label">離開公司網路的資料</p><p class="ww-stat__note">本地 GPU 推論</p></div>
</div>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<div class="ww-grid ww-grid--3">
  <div class="ww-stat"><p class="ww-stat__value">38<span class="ww-stat__unit">hours</span></p><p class="ww-stat__label">Reconciliation time saved each month</p><p class="ww-stat__note">Sample figure</p></div>
  <div class="ww-stat"><p class="ww-stat__value">4<span class="ww-stat__unit">weeks</span></p><p class="ww-stat__label">To the first usable release</p><p class="ww-stat__note">Sample figure</p></div>
  <div class="ww-stat"><p class="ww-stat__value">0</p><p class="ww-stat__label">Records that leave your network</p><p class="ww-stat__note">On-premises GPU inference</p></div>
</div>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
