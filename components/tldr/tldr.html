<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重點摘要 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<section class="ww-tldr" aria-label="重點摘要">
  <p class="ww-tldr__label">重點</p>
  <ul class="ww-tldr__list">
    <li>先認識人與流程，再定義系統。</li>
    <li>第一個版本只做最小可用的範圍，讓團隊真的用起來。</li>
    <li>每一個決定都寫成編號的決策紀錄。</li>
  </ul>
</section>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<section class="ww-tldr" aria-label="Key points">
  <p class="ww-tldr__label">TL;DR</p>
  <ul class="ww-tldr__list">
    <li>Understand the people and the process before defining the system.</li>
    <li>Ship the smallest useful version first, so the team actually uses it.</li>
    <li>Write every decision down as a numbered decision record.</li>
  </ul>
</section>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
