<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>程式碼 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<figure class="ww-code"><figcaption class="ww-code__label">steps.html</figcaption><pre><code>&lt;p class="ww-index"&gt;
  &lt;span class="ww-layers" aria-hidden="true"&gt;…&lt;/span&gt;
  &lt;span class="ww-index__count"&gt;03 / 07&lt;/span&gt;
&lt;/p&gt;</code></pre></figure>
<p class="ww-body">內文中的程式碼寫成 <code>ww-layers</code>，不加引號。</p>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<figure class="ww-code"><figcaption class="ww-code__label">steps.html</figcaption><pre><code>&lt;p class="ww-index"&gt;
  &lt;span class="ww-layers" aria-hidden="true"&gt;…&lt;/span&gt;
  &lt;span class="ww-index__count"&gt;03 / 07&lt;/span&gt;
&lt;/p&gt;</code></pre></figure>
<p class="ww-body">Inline code reads like <code>ww-layers</code>, without quotation marks.</p>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
