<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>錯誤 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<div class="ww-error" role="alert">
  <p class="ww-error__code">503</p>
  <h3 class="ww-error__title">文章暫時無法載入</h3>
  <p class="ww-error__body">伺服器沒有回應。請稍後再試；如果一直發生，請寫信給我們並附上上方的代碼。</p>
  <div class="ww-cluster"><button class="ww-btn ww-btn--primary ww-btn--sm" type="button">重新載入</button><a class="ww-btn ww-btn--ghost ww-btn--sm" href="#">寫信給我們</a></div>
</div>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<div class="ww-error" role="alert">
  <p class="ww-error__code">503</p>
  <h3 class="ww-error__title">Articles could not be loaded</h3>
  <p class="ww-error__body">The server did not respond. Try again in a moment; if it keeps happening, email us with the code above.</p>
  <div class="ww-cluster"><button class="ww-btn ww-btn--primary ww-btn--sm" type="button">Reload</button><a class="ww-btn ww-btn--ghost ww-btn--sm" href="#">Email us</a></div>
</div>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
