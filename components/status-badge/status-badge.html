<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>狀態標記 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<div class="ww-cluster ww-cluster--sm">
  <span class="ww-badge ww-badge--success">已上線</span>
  <span class="ww-badge ww-badge--info">進行中</span>
  <span class="ww-badge ww-badge--warning">等待確認</span>
  <span class="ww-badge ww-badge--danger">已暫停</span>
  <span class="ww-badge ww-badge--neutral">草稿</span>
</div>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<div class="ww-cluster ww-cluster--sm">
  <span class="ww-badge ww-badge--success">Live</span>
  <span class="ww-badge ww-badge--info">In progress</span>
  <span class="ww-badge ww-badge--warning">Awaiting review</span>
  <span class="ww-badge ww-badge--danger">Paused</span>
  <span class="ww-badge ww-badge--neutral">Draft</span>
</div>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
