<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>標誌 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<div class="ww-cluster ww-cluster--lg">
  <img class="ww-logo ww-logo--md" src="../../assets/wordmark/walking-whale-wordmark-horizontal-zh-abyss.svg" alt="走路鯨魚">
  <img class="ww-logo ww-logo--sm" src="../../assets/wordmark/walking-whale-wordmark-horizontal-zh-abyss.svg" alt="走路鯨魚">
</div>
<div class="ww-on-dark ww-section">
  <div class="ww-container"><img class="ww-logo ww-logo--md" src="../../assets/wordmark/walking-whale-wordmark-horizontal-zh-pearl.svg" alt="走路鯨魚"></div>
</div>
<img class="ww-logo ww-logo--stacked" src="../../assets/wordmark/walking-whale-wordmark-stacked-abyss.svg" alt="Walking Whale 走路鯨魚">
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<div class="ww-cluster ww-cluster--lg">
  <img class="ww-logo ww-logo--md" src="../../assets/wordmark/walking-whale-wordmark-horizontal-en-abyss.svg" alt="Walking Whale">
  <img class="ww-logo ww-logo--sm" src="../../assets/wordmark/walking-whale-wordmark-horizontal-en-abyss.svg" alt="Walking Whale">
  <img class="ww-logo ww-logo--md" src="../../assets/mark/walking-whale-mark-abyss.svg" alt="Walking Whale">
</div>
<div class="ww-on-dark ww-section">
  <div class="ww-container"><img class="ww-logo ww-logo--md" src="../../assets/wordmark/walking-whale-wordmark-horizontal-en-pearl.svg" alt="Walking Whale"></div>
</div>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
