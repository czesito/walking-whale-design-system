<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>載入中 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<p class="ww-loading" role="status"><span class="ww-spinner" aria-hidden="true"></span>載入中</p>
<div class="ww-card ww-stack ww-stack--sm" aria-busy="true" aria-label="正在載入文章">
  <span class="ww-skeleton ww-skeleton--title"></span>
  <span class="ww-skeleton ww-skeleton--text"></span>
  <span class="ww-skeleton ww-skeleton--short"></span>
</div>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<p class="ww-loading" role="status"><span class="ww-spinner" aria-hidden="true"></span>Loading</p>
<div class="ww-card ww-stack ww-stack--sm" aria-busy="true" aria-label="Loading article">
  <span class="ww-skeleton ww-skeleton--title"></span>
  <span class="ww-skeleton ww-skeleton--text"></span>
  <span class="ww-skeleton ww-skeleton--short"></span>
</div>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
