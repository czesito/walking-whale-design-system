<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖與引線標註 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<figure class="ww-figure">
  <div class="ww-figure__media ww-figure__media--contain"><img src="../../assets/wordmark/walking-whale-wordmark-stacked-abyss.svg" alt="走路鯨魚直式標誌"></div>
  <figcaption class="ww-figure__caption"><span class="ww-figure__no">Fig. 01</span>直式標誌，Abyss 版</figcaption>
</figure>

<figure class="ww-figure ww-figure--annotated">
  <div class="ww-figure__media">
    <svg class="ww-annot" viewBox="0 0 1200 680" role="img" aria-labelledby="annot-title-zh annot-desc-zh">
      <title id="annot-title-zh">走路鯨魚標誌的引線標註</title><desc id="annot-desc-zh">鯨魚骨架上的三個標註：頭部、脊椎與尾部</desc>
      <image href="../../assets/mark/walking-whale-mark-bone.svg" x="160" y="200" width="890.6" height="329.5"/>
      <g class="ww-annot__item ww-annot__item--end">
        <path class="ww-annot__line" d="M467 283 L400 130 H150"/><circle class="ww-annot__dot" cx="467" cy="283" r="6"/>
        <text class="ww-annot__title" x="400" y="118">人性為聲</text><text class="ww-annot__sub" x="400" y="160">頭部：鯨歌從這裡發出</text>
        <g class="ww-annot__marker"><circle cx="467" cy="283" r="34"/><text x="467" y="285">1</text></g>
      </g>
      <g class="ww-annot__item">
        <path class="ww-annot__line" d="M703 228 L770 110 H1070"/><circle class="ww-annot__dot" cx="703" cy="228" r="6"/>
        <text class="ww-annot__title" x="770" y="98">理性為骨</text><text class="ww-annot__sub" x="770" y="140">脊椎：撐起整個身體的結構</text>
        <g class="ww-annot__marker"><circle cx="703" cy="228" r="34"/><text x="703" y="230">2</text></g>
      </g>
      <g class="ww-annot__item ww-annot__item--end">
        <path class="ww-annot__line" d="M996 464 L940 590 H690"/><circle class="ww-annot__dot" cx="996" cy="464" r="6"/>
        <text class="ww-annot__title" x="940" y="578">生命為動</text><text class="ww-annot__sub" x="940" y="620">尾部：推進與轉向</text>
        <g class="ww-annot__marker"><circle cx="996" cy="464" r="34"/><text x="996" y="466">3</text></g>
      </g>
    </svg>
  </div>
  <ol class="ww-annot__legend"><li><strong>人性為聲</strong><span>頭部：鯨歌從這裡發出</span></li><li><strong>理性為骨</strong><span>脊椎：撐起整個身體的結構</span></li><li><strong>生命為動</strong><span>尾部：推進與轉向</span></li></ol>
  <figcaption class="ww-figure__caption"><span class="ww-figure__no">Fig. 02</span>標誌的三個部位與標語</figcaption>
</figure>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<figure class="ww-figure">
  <div class="ww-figure__media ww-figure__media--contain"><img src="../../assets/wordmark/walking-whale-wordmark-stacked-abyss.svg" alt="Stacked Walking Whale logo"></div>
  <figcaption class="ww-figure__caption"><span class="ww-figure__no">Fig. 01</span>Stacked logo, Abyss</figcaption>
</figure>

<figure class="ww-figure ww-figure--annotated">
  <div class="ww-figure__media">
    <svg class="ww-annot" viewBox="0 0 1200 680" role="img" aria-labelledby="annot-title-en annot-desc-en">
      <title id="annot-title-en">Annotated Walking Whale mark</title><desc id="annot-desc-en">Three labels on the whale skeleton: head, spine and tail</desc>
      <image href="../../assets/mark/walking-whale-mark-bone.svg" x="160" y="200" width="890.6" height="329.5"/>
      <g class="ww-annot__item ww-annot__item--end">
        <path class="ww-annot__line" d="M467 283 L400 130 H84"/><circle class="ww-annot__dot" cx="467" cy="283" r="6"/>
        <text class="ww-annot__title" x="400" y="118">Human in voice</text><text class="ww-annot__sub" x="400" y="160">Head: where song begins</text>
        <g class="ww-annot__marker"><circle cx="467" cy="283" r="34"/><text x="467" y="285">1</text></g>
      </g>
      <g class="ww-annot__item">
        <path class="ww-annot__line" d="M703 228 L770 110 H1110"/><circle class="ww-annot__dot" cx="703" cy="228" r="6"/>
        <text class="ww-annot__title" x="770" y="98">Scientific in structure</text><text class="ww-annot__sub" x="770" y="140">Spine: what holds it up</text>
        <g class="ww-annot__marker"><circle cx="703" cy="228" r="34"/><text x="703" y="230">2</text></g>
      </g>
      <g class="ww-annot__item ww-annot__item--end">
        <path class="ww-annot__line" d="M996 464 L940 590 H660"/><circle class="ww-annot__dot" cx="996" cy="464" r="6"/>
        <text class="ww-annot__title" x="940" y="578">Alive in motion</text><text class="ww-annot__sub" x="940" y="620">Tail: drive and turn</text>
        <g class="ww-annot__marker"><circle cx="996" cy="464" r="34"/><text x="996" y="466">3</text></g>
      </g>
    </svg>
  </div>
  <ol class="ww-annot__legend"><li><strong>Human in voice</strong><span>Head: where song begins</span></li><li><strong>Scientific in structure</strong><span>Spine: what holds it up</span></li><li><strong>Alive in motion</strong><span>Tail: drive and turn</span></li></ol>
  <figcaption class="ww-figure__caption"><span class="ww-figure__no">Fig. 02</span>Three parts of the mark and the tagline</figcaption>
</figure>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
