<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>引言 · Walking Whale Design System</title>
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../dist/ww.css">
</head>
<body>
<main class="ww-container ww-section ww-stack ww-stack--xl">
<section class="ww-stack" lang="zh-Hant">
<p class="ww-lang-label">zh-Hant</p>
<blockquote class="ww-pullquote">
  <p class="ww-pullquote__text">一年後，您希望團隊少做哪三件事？</p>
  <cite class="ww-pullquote__cite">第一次見面時我們會問的問題</cite>
</blockquote>
</section>
<section class="ww-stack" lang="en">
<p class="ww-lang-label">en</p>
<blockquote class="ww-pullquote">
  <p class="ww-pullquote__text">A year from now, which three things should your team no longer have to do?</p>
  <cite class="ww-pullquote__cite">The question we ask at a first meeting</cite>
</blockquote>
</section>
</main>
<script src="../../dist/ww.js"></script>
</body>
</html>
